
spring.application.name=secure-database-access

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:customerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console - Disabled for security
spring.h2.console.enabled=false


# HTTPS Configuration
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:./certs/localhost-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-alias=localhost

app.security.admin-password=${APP_ADMIN_PASSWORD}
app.security.user-password=${APP_USER_PASSWORD}
